name: Kick Puppeteer Tracker

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Kick Tracker Scraper
        run: node tracker.js

      - name: Commit and Push Database & IDs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add database and the ID registry
          git add kick_tracker.db ids.txt
          
          # Commit only if there are changes
          git diff --staged --quiet || (git commit -m "auto: update tracker database and ids.txt [skip ci]" && git push)