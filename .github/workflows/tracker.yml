name: Kick Puppeteer Tracker

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit sqlite db updates back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Puppeteer Harvester
        run: node tracker.js

      - name: Commit and Push Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force add the database file
          git add -f kick_tracker.db
          
          if ! git diff --cached --quiet; then
            git commit -m "auto: sync channel database and username timeline [skip ci]"
            git push
          else
            echo "No changes detected in database."
          fi