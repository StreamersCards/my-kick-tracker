name: Kick Streamer Monitor

on:
  schedule:
    # GitHub may delay scheduled jobs, but this requests a check every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    concurrency:
      group: kick-streamer-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for clean merging

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Streamers and Save Chat
        run: npm run check-streamers

      - name: Commit and Push Database & IDs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -f kick_tracker.db logz.txt
          
          git diff --staged --quiet || (git commit -m "auto: update streamer chat logs [skip ci]" && git push origin main)