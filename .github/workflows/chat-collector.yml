name: Kick Chat Collector (5 min)

on:
  schedule:
    # Every 5 minutes: poll streamers.txt for live status + save chat messages/users.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-chat:
    runs-on: ubuntu-latest
    concurrency:
      group: kick-db-writer
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Collect Live Chat
        run: npm run check-streamers

      - name: Commit and Push Chat Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -f kick_tracker.db logz.txt

          if git diff --staged --quiet; then
            echo "No changes to push."
            exit 0
          fi

          git commit -m "auto: chat messages update [skip ci]"

          # Safety net: if main moved while we worked, rebase and retry.
          for attempt in 1 2 3; do
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto latest main..."
            git pull --rebase origin main
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
          done
