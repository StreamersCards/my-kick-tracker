name: Kick Chat Collector (15 min x3)

on:
  schedule:
    # Every 15 min (reliable tier): each run polls 3x at 5-min spacing,
    # so chat granularity stays 5 min without relying on flaky */5 cron.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-chat:
    runs-on: ubuntu-latest
    concurrency:
      group: kick-db-writer
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Collect Live Chat (3x, 5 min apart)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          push_chat_data() {
            git add -f kick_tracker.db logz.txt

            if git diff --staged --quiet; then
              echo "No changes to push."
              return 0
            fi

            git commit -m "auto: chat messages update [skip ci]"

            # Safety net: if main moved while we worked, rebase and retry.
            for attempt in 1 2 3; do
              if git push origin main; then
                return 0
              fi
              echo "Push rejected (attempt $attempt). Rebasing onto latest main..."
              git pull --rebase origin main
              sleep 5
              if [ "$attempt" = "3" ]; then
                echo "Push failed after 3 attempts."
                return 1
              fi
            done
          }

          for poll in 1 2 3; do
            echo "=== Poll $poll of 3 ==="
            npm run check-streamers
            push_chat_data || exit 1
            if [ "$poll" != "3" ]; then
              echo "Sleeping 5 minutes before next poll..."
              sleep 300
            fi
          done
